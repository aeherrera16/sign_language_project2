name: CD - Construir Aplicaciones

on:
  workflow_run:
    workflows: ["CI - Integración Continua"]
    types: [completed]
    branches: [main, feature/prototipo-funcional]

jobs:
  build-windows:
    name: '🪟 Ejecutable Windows (.exe)'
    runs-on: windows-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias + PyInstaller
        run: |
          pip install --no-cache-dir opencv-python mediapipe tensorflow pyttsx3 scikit-learn pyinstaller

      - name: Convertir ícono a .ico
        run: |
          pip install Pillow
          python -c "
          from PIL import Image
          img = Image.open('prototipo/icon.png')
          img.save('prototipo/icon.ico', sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])
          print('Icon converted')
          "

      - name: Construir ejecutable con PyInstaller
        run: |
          pyinstaller build/traductor_lse.spec --noconfirm --clean
          echo "Build complete"
          dir dist\TraductorLSE

      - name: Subir artefacto Windows
        uses: actions/upload-artifact@v4
        with:
          name: TraductorLSE-Windows
          path: dist/TraductorLSE/
          retention-days: 90

  build-macos:
    name: '🍎 Ejecutable macOS (.app)'
    runs-on: macos-13
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias + PyInstaller
        run: |
          pip install --no-cache-dir opencv-python mediapipe tensorflow pyttsx3 scikit-learn pyinstaller

      - name: Construir ejecutable con PyInstaller
        run: |
          pyinstaller build/traductor_lse.spec --noconfirm --clean
          echo "Build complete"
          ls -la dist/

      - name: Subir artefacto macOS
        uses: actions/upload-artifact@v4
        with:
          name: TraductorLSE-macOS
          path: dist/TraductorLSE.app/
          retention-days: 90
