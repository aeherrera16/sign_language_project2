name: CD - Construir Aplicaciones

on:
  push:
    branches: [main, feature/prototipo-funcional]
  workflow_dispatch:

jobs:
  verificar:
    name: '🧪 Verificar código (CI)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Verificar
        run: |
          pip install --no-cache-dir opencv-python-headless mediapipe tensorflow pyttsx3 scikit-learn
          python -c "import cv2, mediapipe, tensorflow, sklearn; print('✅ Imports OK')"
          python -m py_compile prototipo/menu.py
          python -m py_compile prototipo/1_grabar_senas.py
          python -m py_compile prototipo/2_entrenar_modelo.py
          python -m py_compile prototipo/3_traductor.py
          python -m py_compile prototipo/4_evaluar_iso25023.py
          echo "✅ CI passed"

  build-windows:
    name: '🪟 Ejecutable Windows (.exe)'
    runs-on: windows-latest
    needs: verificar

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install --no-cache-dir opencv-python mediapipe tensorflow pyttsx3 scikit-learn pyinstaller

      - name: Limpiar paquetes innecesarios
        shell: pwsh
        run: |
          pip uninstall -y tensorboard tensorboard-data-server tensorboard-plugin-wit -q 2>$null
          $sp = python -c "import site; print(site.getsitepackages()[0])"
          @('tensorboard','tensorboard_data_server','tensorboard_plugin_wit') | ForEach-Object {
            $p = Join-Path $sp $_
            if (Test-Path $p) { Remove-Item $p -Recurse -Force; Write-Host "Removed $_" }
          }

      - name: Convertir ícono
        run: |
          pip install Pillow
          python -c "from PIL import Image; img=Image.open('prototipo/icon.png'); img.save('prototipo/icon.ico', sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])"

      - name: Construir con PyInstaller
        run: |
          pyinstaller build/traductor_lse.spec --noconfirm --clean

      - name: Incluir DLLs de VC++ Runtime
        shell: pwsh
        run: |
          $vcDlls = @('msvcp140.dll', 'msvcp140_1.dll', 'vcruntime140.dll', 'vcruntime140_1.dll', 'concrt140.dll')
          $searchPaths = @(
            "$env:SystemRoot\System32",
            "$env:SystemRoot\SysWOW64",
            "${env:ProgramFiles(x86)}\Microsoft Visual Studio\*\*\VC\Redist\MSVC\*\x64\*"
          )
          foreach ($dll in $vcDlls) {
            foreach ($sp in $searchPaths) {
              $found = Get-ChildItem -Path $sp -Filter $dll -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($found) {
                Copy-Item $found.FullName -Destination "dist\TraductorLSE\" -Force
                Write-Host "✅ Copiado: $dll"
                break
              }
            }
          }

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: TraductorLSE-Windows
          path: dist/TraductorLSE/
          retention-days: 90

