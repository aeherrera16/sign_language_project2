name: CD - Construir Aplicaciones

on:
  push:
    branches: [main, feature/prototipo-funcional]
  workflow_dispatch:

jobs:
  build-windows:
    name: '🪟 App Windows'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Crear runtime portable
        shell: pwsh
        run: |
          $pythonDir = Split-Path (Get-Command python).Source
          Write-Host "📦 Copiando Python como runtime portable..."
          Copy-Item -Path $pythonDir -Destination "build/runtime" -Recurse

          Write-Host "📦 Instalando dependencias en el runtime..."
          & "build/runtime/python.exe" -m pip install --no-cache-dir --no-warn-script-location `
            opencv-python mediapipe tensorflow pyttsx3 scikit-learn

          Write-Host "🧹 Limpiando archivos innecesarios..."
          @(
            "build/runtime/Doc",
            "build/runtime/Tools",
            "build/runtime/Lib/test",
            "build/runtime/Lib/unittest/test",
            "build/runtime/Lib/idlelib",
            "build/runtime/Lib/ensurepip",
            "build/runtime/NEWS.txt"
          ) | ForEach-Object {
            if (Test-Path $_) { Remove-Item $_ -Recurse -Force -ErrorAction SilentlyContinue }
          }
          Get-ChildItem "build/runtime" -Recurse -Directory -Filter "__pycache__" |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

      - name: Empaquetar aplicación
        shell: pwsh
        run: |
          Copy-Item "prototipo" "build/prototipo" -Recurse
          Copy-Item "Traductor_LSE.vbs" "build/"
          Copy-Item "Iniciar_LSE.bat" "build/"

          Get-ChildItem "build/prototipo" -Recurse -Directory -Filter "__pycache__" |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

          $size = [math]::Round((Get-ChildItem "build" -Recurse | Measure-Object Length -Sum).Sum / 1MB, 2)
          Write-Host "📊 Tamaño del paquete: $size MB"

      - name: Subir artefacto Windows
        uses: actions/upload-artifact@v4
        with:
          name: TraductorLSE-Windows
          path: build/
          retention-days: 90
          compression-level: 9

  build-macos:
    name: '🍎 App macOS'
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Crear entorno portable
        run: |
          echo "📦 Creando entorno virtual portable..."
          python3 -m venv --copies build/.venv
          source build/.venv/bin/activate

          echo "📦 Instalando dependencias..."
          pip install --no-cache-dir opencv-python mediapipe tensorflow pyttsx3 scikit-learn

          echo "🧹 Limpiando..."
          find build/.venv -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true

      - name: Empaquetar aplicación
        run: |
          cp -R prototipo build/prototipo
          cp -R TraductorLSE.app build/TraductorLSE.app
          cp Iniciar_LSE.command build/

          find build/prototipo -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true

          echo "📊 Tamaño del paquete: $(du -sh build | cut -f1)"

      - name: Subir artefacto macOS
        uses: actions/upload-artifact@v4
        with:
          name: TraductorLSE-macOS
          path: build/
          retention-days: 90
          compression-level: 9
