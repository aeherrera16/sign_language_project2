name: Prueba - Ejecutable mínimo de diagnóstico

on:
  workflow_dispatch:
  push:
    branches: [feature/prototipo-funcional-kiosk]
    paths:
      - build/prueba_minima.py
      - .github/workflows/test-minimal.yml

jobs:
  build-minimal:
    name: '🔬 .exe mínimo (diagnóstico)'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar PyInstaller
        run: pip install --no-cache-dir pyinstaller

      - name: Construir .exe mínimo
        run: |
          pyinstaller --onefile --windowed --name PruebaLSE build/prueba_minima.py

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: PruebaLSE-minima
          path: dist/PruebaLSE.exe
          retention-days: 7
