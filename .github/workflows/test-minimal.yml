name: Prueba - Ejecutable mínimo de diagnóstico

on:
  workflow_dispatch:
  push:
    branches: [feature/prototipo-funcional-kiosk]
    paths:
      - build/prueba_minima.py
      - build/prueba_pesada.py
      - .github/workflows/test-minimal.yml

jobs:
  build-minimal:
    name: '🔬 .exe mínimo (diagnóstico)'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar PyInstaller
        run: pip install --no-cache-dir pyinstaller

      - name: Construir .exe mínimo (onefile)
        run: |
          pyinstaller --onefile --windowed --name PruebaLSE build/prueba_minima.py

      - name: Construir .exe mínimo (onedir, misma estructura que el traductor)
        run: |
          pyinstaller --windowed --name PruebaLSE-onedir build/prueba_minima.py

      - name: Subir artefacto (onefile)
        uses: actions/upload-artifact@v4
        with:
          name: PruebaLSE-minima
          path: dist/PruebaLSE.exe
          retention-days: 7

      - name: Subir artefacto (onedir)
        uses: actions/upload-artifact@v4
        with:
          name: PruebaLSE-onedir
          path: dist/PruebaLSE-onedir/
          retention-days: 7

      - name: Instalar mediapipe + tensorflow
        run: |
          pip install --no-cache-dir mediapipe==0.10.21 tensorflow

      - name: Construir .exe con mediapipe + tensorflow (sin lógica del traductor)
        run: |
          pyinstaller --windowed --name PruebaLSE-pesada --collect-all mediapipe build/prueba_pesada.py

      - name: Subir artefacto (pesada)
        uses: actions/upload-artifact@v4
        with:
          name: PruebaLSE-pesada
          path: dist/PruebaLSE-pesada/
          retention-days: 7

      - name: Convertir ícono
        run: |
          pip install Pillow
          python -c "from PIL import Image; img=Image.open('prototipo/icon.png'); img.save('build/icon.ico', sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])"

      - name: Generar recurso de versión (.exe) de prueba
        shell: python
        run: |
          contenido = '''# UTF-8
          VSVersionInfo(
            ffi=FixedFileInfo(
              filevers=(1,0,0,0),
              prodvers=(1,0,0,0),
              mask=0x3f,
              flags=0x0,
              OS=0x40004,
              fileType=0x1,
              subtype=0x0,
              date=(0,0)
            ),
            kids=[
              StringFileInfo(
                [StringTable(
                  u"040904B0",
                  [StringStruct(u"CompanyName", u"Anahy Herrera"),
                   StringStruct(u"FileDescription", u"Prueba LSE"),
                   StringStruct(u"FileVersion", u"1.0.0"),
                   StringStruct(u"InternalName", u"PruebaLSE"),
                   StringStruct(u"OriginalFilename", u"PruebaLSE-iconoversion.exe"),
                   StringStruct(u"ProductName", u"Prueba LSE"),
                   StringStruct(u"ProductVersion", u"1.0.0")])]),
              VarFileInfo([VarStruct(u"Translation", [1033, 1200])])
            ]
          )
          '''
          with open("build/version_info_prueba.txt", "w", encoding="utf-8") as f:
              f.write(contenido)

      - name: Construir .exe con mediapipe + tensorflow + ícono + versión (igual al traductor real)
        run: |
          pyinstaller --windowed --name PruebaLSE-iconoversion --collect-all mediapipe --icon build/icon.ico --version-file build/version_info_prueba.txt build/prueba_pesada.py

      - name: Subir artefacto (icono+version)
        uses: actions/upload-artifact@v4
        with:
          name: PruebaLSE-iconoversion
          path: dist/PruebaLSE-iconoversion/
          retention-days: 7

      - name: Instalar cv2 + sklearn + pyttsx3
        run: |
          pip install --no-cache-dir opencv-python scikit-learn pyttsx3

      - name: Construir .exe completo (onefile, todas las dependencias reales)
        run: |
          pyinstaller --onefile --windowed --name PruebaLSE-completa --collect-all mediapipe --icon build/icon.ico --version-file build/version_info_prueba.txt --hidden-import pyttsx3.drivers --hidden-import pyttsx3.drivers.sapi5 --hidden-import sklearn.utils._typedefs --hidden-import sklearn.neighbors._partition_nodes build/prueba_pesada.py

      - name: Subir artefacto (completa, onefile)
        uses: actions/upload-artifact@v4
        with:
          name: PruebaLSE-completa
          path: dist/PruebaLSE-completa.exe
          retention-days: 7
