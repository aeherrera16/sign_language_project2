version: '3.8'

services:
  # LocalAI - Alternativa a LM Studio con API compatible OpenAI  
  localai:
    image: localai/localai:latest-cpu
    container_name: lse_localai
    ports:
      - "8080:8080"
    environment:
      - THREADS=4
      - CONTEXT_SIZE=512
      - MODELS_PATH=/models
      - PRELOAD_MODELS=[{"id":"gpt-3.5-turbo","url":"github:go-skynet/model-gallery/gpt-3.5-turbo-ggml.yaml"}]
      - DEBUG=false
    volumes:
      - ./docker/localai/models:/models
      - ./docker/localai/config:/config
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/readyz"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - lse_network

  # n8n - Orquestador de workflows
  n8n:
    image: n8nio/n8n:latest
    container_name: lse_n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=false
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=America/Guayaquil
      - N8N_LOG_LEVEL=info
    volumes:
      - ./docker/n8n/data:/home/node/.n8n
    restart: unless-stopped
    depends_on:
      - localai
    networks:
      - lse_network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: lse_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app:rw
      - ./data/gestures:/app/data/gestures:rw
      - ./uploads:/app/uploads:rw
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - localai
    networks:
      - lse_network

  frontend:
    build:
      context: .
      dockerfile: frontend/react_app/Dockerfile
    container_name: lse_frontend
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./frontend/react_app:/app:rw
    networks:
      - lse_network

networks:
  lse_network:
    driver: bridge

volumes:
  localai_models:
  n8n_data:
